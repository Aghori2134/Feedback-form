
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Versatile Technology - Website Feedback</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
		html{
			scroll-behavior:smooth;
		}
        * {
            box-sizing:border-box;
        }

        html {
            scroll-behavior:smooth;
        }

        body {
            font-family:'Inter', sans-serif;
        }

        h1, h2, h3 {
            font-family:'Poppins', sans-serif;
        }

        .card {
            animation:appear 1s ease;
        }

        @keyframes appear {
            from {
                opacity:0;
                transform:translateY(25px);
            }

            to {
                opacity:1;
                transform: translateY(0);
            }
        }

        input, textarea, select {
            transition: 0.3s ease;
        }
		.card1{
			animation:appear1 1s ease;
		}
		@keyframes appear1{
            from {
                opacity:0;
            }

            to {
                opacity:1;
            }
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800">
    <header class="bg-white border-b border-sky-100 sticky top-0 z-50">

        <div class="max-w-7xl mx-auto px-5 sm:px-6 py-4">

            <nav class="flex items-center justify-between">

                <a href="https://versatiletechnology.in/"
                   class="flex items-center gap-3">

                    <img
                        src="https://versatiletechnology.in/versatile.png"
                        alt="Versatile Technology Logo"
                        class="w-12 h-12 object-contain">

                    <div>
                        <h2 class="font-bold text-xl">Versatile</h2>

                        <p class="text-sky-500 font-semibold text-sm">
                            TECHNOLOGY
                        </p>
                    </div>

                </a>

                <a href="#feedback"
                   class="hidden sm:flex items-center gap-2 px-5 py-3 rounded-xl
                   bg-gradient-to-r from-sky-500 to-emerald-400
                   text-white font-semibold hover:shadow-lg transition">

                    Share Feedback
                    <i class="ri-arrow-right-line"></i>

                </a>

            </nav>

        </div>

    </header>
    <section id="feedback" class="py-12 sm:py-16 lg:py-20 px-4 sm:px-6">

        <div class="max-w-3xl mx-auto">
            <div class="text-center mb-10 card1">
                <h1 class="text-3xl sm:text-4xl font-bold mt-5">
                    Tell Us What You Think
                </h1>
            </div>
            <form action="#" method="post"
                  class="bg-white border border-sky-100
                  rounded-3xl shadow-xl p-6 sm:p-8 md:p-10 card">
                <div class="flex items-center gap-4 mb-8">

                    <div class="w-14 h-14 shrink-0 rounded-2xl
                    bg-gradient-to-br from-sky-100 to-emerald-100
                    text-sky-600 flex items-center justify-center text-3xl">

                        <i class="ri-edit-box-line"></i>

                    </div>

                    <div>
                        <h2 class="text-xl sm:text-2xl font-bold">
                            Share Your Feedback
                        </h2>

                        <p class="text-sm text-slate-500 mt-1">
                            About versatiletechnology.in
                        </p>
                    </div>

                </div>
                <div class="mb-6">

                    <label for="feedbackText" class="block font-semibold mb-2">
                        Your Feedback <span class="text-red-500">*</span>
                    </label>

                    <textarea
                        id="feedbackText"
                        name="feedback"
                        rows="5"
                        required
                        placeholder="Tell us about your experience with our website..."
                        class="w-full px-4 py-3.5 rounded-xl border
                        border-slate-200 outline-none resize-y
                        focus:border-sky-400 focus:ring-4 focus:ring-sky-100"></textarea>

                </div>
                <button
                    type="submit"
                    class="w-full py-4 rounded-xl
                    bg-gradient-to-r from-sky-500 to-emerald-400
                    text-white font-semibold text-lg
                    flex items-center justify-center gap-2
                    hover:shadow-xl hover:-translate-y-1 transition">

                    Submit Feedback
                    <i class="ri-send-plane-fill"></i>

                </button>

                <p class="text-center text-xs text-slate-400 mt-5">
                    <i class="ri-lock-line"></i>
                    Thank you for helping us!
                </p>

            </form>

        </div>

    </section>
    <footer class="bg-slate-900 text-white py-8 px-6">

        <div class="max-w-7xl mx-auto">

            <div class="flex flex-col sm:flex-row justify-between
            items-center gap-6">

                <a href="https://versatiletechnology.in/"
                   class="flex items-center gap-3">

                    <img
                        src="https://versatiletechnology.in/versatile.png"
                        alt="Versatile Technology Logo"
                        class="w-10 h-10 object-contain">

                    <div>
                        <h3 class="font-bold">Versatile Technology</h3>

                        <p class="text-sm text-slate-400">
                            Innovation • Technology • Growth
                        </p>
                    </div>

                </a>
                <div class="flex gap-3">

                    <a href="https://www.instagram.com/versatile__technology/?hl=en"
                       target="_blank"
                       rel="noopener noreferrer"
                       aria-label="Instagram"
                       class="w-10 h-10 rounded-full bg-slate-800
                       flex items-center justify-center
                       hover:bg-sky-500 transition">

                        <i class="ri-instagram-line text-xl"></i>

                    </a>

                    <a href="https://www.youtube.com/@versatile__technology"
                       target="_blank"
                       rel="noopener noreferrer"
                       aria-label="YouTube"
                       class="w-10 h-10 rounded-full bg-slate-800
                       flex items-center justify-center
                       hover:bg-sky-500 transition">

                        <i class="ri-youtube-fill text-xl"></i>

                    </a>

                    <a href="https://www.linkedin.com/company/versatile-technology6/posts/?feedView=all"
                       target="_blank"
                       rel="noopener noreferrer"
                       aria-label="LinkedIn"
                       class="w-10 h-10 rounded-full bg-slate-800
                       flex items-center justify-center
                       hover:bg-sky-500 transition">

                        <i class="ri-linkedin-fill text-xl"></i>

                    </a>

                </div>

            </div>


            <div class="border-t border-slate-800 mt-7 pt-6
            text-center text-sm text-slate-500">

                © 2026 Versatile Technology. All rights reserved.

            </div>

        </div>

    </footer>

</body>
</html>
